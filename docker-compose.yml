services:
  database:
    image: postgres:15-alpine
    container_name: nexora_db
    environment:
      POSTGRES_DB: nexora_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: nexora-backend
    env_file:
      - .env.dev
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://nexora_db:5432/nexora_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - nexora-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: nexora-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nexora-network

volumes:
  postgres_data:

networks:
  nexora-network:
    driver: bridge