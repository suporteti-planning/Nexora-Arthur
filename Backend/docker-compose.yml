version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-backend
    ports:
      - "8080:8080"
    env_file:
      - .env.dev
    depends_on:
      - postgres
    networks:
      - nexora-network
    volumes:
      - ./logs:/app/logs

  postgres:
    image: postgres:15
    container_name: nexora-postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-nexora_db}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexora-network

volumes:
  postgres_data:

networks:
  nexora-network:
    driver: bridge