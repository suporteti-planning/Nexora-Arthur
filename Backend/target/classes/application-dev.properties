# Ambiente de desenvolvimento
app.environment=dev
app.dev.enabled=true

# Desabilitar Azure em dev
spring.cloud.azure.active-directory.enabled=false

# Configurações dev
app.dev.username=admin
app.dev.password=admin
app.dev.role=ROLE_ADMIN

# Evita volume excessivo de SQL/log durante sincronizações locais.
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.nexora.planning.nexora=INFO
logging.level.com.microsoft.graph=INFO
logging.level.com.azure.identity=INFO