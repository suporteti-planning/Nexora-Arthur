# ============================================
# AMBIENTE
# ============================================
app.environment=${APP_ENVIRONMENT:dev}

# ============================================
# CREDENCIAIS DE DESENVOLVIMENTO
# ============================================
app.dev.username=${APP_DEV_USERNAME:admin}
app.dev.password=${APP_DEV_PASSWORD:admin}
app.dev.role=${APP_DEV_ROLE:ROLE_ADMIN}

# ============================================
# MICROSOFT GRAPH (Azure AD)
# ============================================
spring.cloud.azure.active-directory.enabled=${AZURE_ENABLED:false}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_CLIENT_ID:}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_CLIENT_SECRET:}

# Timeouts de conexão (em milissegundos)
microsoft.graph.connection-timeout=30000
microsoft.graph.read-timeout=60000

# Microsoft Graph - Configuração alternativa (vai usar o que encontrar)
microsoft.graph.tenant-id=${AZURE_TENANT_ID:}
microsoft.graph.client-id=${AZURE_CLIENT_ID:}
microsoft.graph.client-secret=${AZURE_CLIENT_SECRET:}
microsoft.graph.api-url=https://graph.microsoft.com/v1.0

# ============================================
# JWT
# ============================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# BANCO DE DADOS
# ============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexora_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# CORS
# ============================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}

# ============================================
# LOGGING
# ============================================
logging.level.root=${LOGGING_LEVEL:INFO}
logging.level.nexora.planning.nexora=${LOGGING_LEVEL:DEBUG}
logging.level.com.microsoft.graph=${LOGGING_LEVEL:DEBUG}
logging.level.com.azure.identity=${LOGGING_LEVEL:DEBUG}