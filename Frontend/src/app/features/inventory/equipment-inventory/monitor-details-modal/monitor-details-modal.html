<div class="modal-overlay" (click)="onOverlayClick($event)">
  <section class="modal-container" role="dialog" aria-modal="true" aria-labelledby="monitor-details-title">
    <header class="modal-header">
      <div>
        <span class="eyebrow">Detalhes do equipamento</span>
        <h2 id="monitor-details-title">{{ monitor.name }}</h2>
      </div>
      <button class="close-btn" type="button" aria-label="Fechar" (click)="close()">&#10005;</button>
    </header>

    <div class="modal-body">
      <div class="status-summary">
        <span class="summary-label">Status atual</span>
        <span class="status-badge" [class.active]="formData.status === 'ACTIVE'" [class.inactive]="formData.status === 'INACTIVE'" [class.maintenance]="formData.status === 'MAINTENANCE'" [class.reverse]="formData.status === 'REVERSE'">
          {{ getStatusLabel(formData.status) }}
        </span>
      </div>

      <div class="form-grid">
        <label class="form-group">Nome-Patrimônio *<input name="name" [(ngModel)]="formData.name"></label>
        <label class="form-group">Marca *<input name="brand" [(ngModel)]="formData.brand"></label>
        <label class="form-group">Modelo *<input name="model" [(ngModel)]="formData.model"></label>
        <label class="form-group">Número de série *<input name="serialNumber" [(ngModel)]="formData.serialNumber"></label>
        <label class="form-group">Preço
          <span class="price-input"><span class="currency-prefix">R$</span><input name="price" type="number" min="0" step="0.01" [(ngModel)]="formData.price"></span>
        </label>
        <label class="form-group">Status *
          <select name="status" [(ngModel)]="formData.status">
            <option value="ACTIVE">Ativo</option>
            <option value="INACTIVE">Inativo</option>
            <option value="MAINTENANCE">Em Manutenção</option>
            <option value="REVERSE">Em coleta</option>
          </select>
        </label>
        <label class="form-group">Centro de custo *
          <select name="costCenter" [(ngModel)]="formData.costCenter">
            <option value="" disabled>Selecione uma opção</option>
            @for (center of costCenters; track center[0]) {
              <option [value]="center[0]">{{ center[1] }}</option>
            }
          </select>
        </label>
        <label class="form-group full-width employee-field">Colaborador vinculado
          <div class="employee-search-wrapper" (click)="$event.stopPropagation()">
            <input id="monitor-details-employee-search" name="employeeSearch" autocomplete="off"
              placeholder="Buscar por nome, e-mail ou cargo..."
              [ngModel]="employeeSearch" (ngModelChange)="onEmployeeSearch($event)" />
            <button type="button" class="clear-employee" aria-label="Remover vínculo" (click)="clearEmployee()" [disabled]="!formData.employeeId">&#10005;</button>
            @if (employees.length) {
              <div class="employee-options">
                @for (employee of employees; track employee.id) {
                  <button type="button" class="employee-option" (click)="selectEmployee(employee)">
                    <strong>{{ employee.name }}</strong>
                    <span>{{ employee.email }}{{ employee.position ? ' · ' + employee.position : '' }}</span>
                  </button>
                }
              </div>
            }
          </div>
          @if (formData.employee) {
            <small>Vinculado a {{ formData.employee.name }} ({{ formData.employee.email }})</small>
          } @else {
            <small>Opcional. Pesquise e selecione um colaborador ativo ou deixe sem vínculo.</small>
          }
          @if (searchingEmployees) { <small>Pesquisando colaboradores...</small> }
          @if (employeeSearchError) { <small class="message error" role="alert">{{ employeeSearchError }}</small> }
        </label>
        <label class="form-group full-width">Observações<textarea name="observations" rows="3" [(ngModel)]="formData.observations"></textarea></label>
      </div>
      @if (errorMessage) { <p class="message error" role="alert">{{ errorMessage }}</p> }
    </div>

    <footer class="modal-footer">
      <button class="btn-secondary" type="button" (click)="close()">Fechar</button>
      <button class="btn-primary" type="button" [disabled]="!isFormValid() || isSaving" (click)="save()">
        {{ isSaving ? 'Salvando...' : 'Salvar alterações' }}
      </button>
    </footer>
  </section>
</div>
